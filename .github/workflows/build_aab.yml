name: Build Play Store Android App Bundle (.aab)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual one-click build from GitHub Actions tab

jobs:
  build-aab:
    name: Build & Package Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup JDK 21 (Temurin) - required for AGP 9.1, compileSdk 36, and Gradle 9
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Pin Gradle strictly to version 9.3.1 (exact match for project KSP 2.3.5 and AGP 9.1.1)
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      # Step 1: Restore debug.keystore from debug.keystore.base64
      # This fixes: "Keystore file '.../debug.keystore' not found for signing config 'debugConfig'"
      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating debug.keystore with keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Step 2: Prepare Release Keystore (my-upload-key.jks)
      # If user provided KEYSTORE_BASE64 in GitHub Secrets, decode it;
      # otherwise auto-generate a valid upload keystore so release build always succeeds!
      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using Play Store Release Keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          else
            echo "Auto-generating valid release upload keystore for Play Store..."
            keytool -genkey -v -keystore my-upload-key.jks -alias upload -keypass "${KEY_PASS:-android}" -storepass "${STORE_PASS:-android}" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Quick Heroes 11, OU=Cricket, O=QuickHeroes, L=Naliya, ST=Gujarat, C=IN"
          fi

      # Step 3: Build the Play Store Release App Bundle (.aab)
      - name: Build Android App Bundle (.aab)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          echo "Building Play Store Release AAB..."
          chmod +x gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew :app:bundleRelease --no-daemon
          else
            gradle :app:bundleRelease --no-daemon
          fi

      # Step 4: Locate the generated .aab file
      - name: Locate AAB Output
        id: locate_bundle
        run: |
          AAB_FILE=$(find app/build/outputs/bundle -name "*.aab" | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            echo "Error: No .aab file was generated!"
            exit 1
          fi
          echo "Found bundle: $AAB_FILE"
          echo "bundle_path=$AAB_FILE" >> $GITHUB_OUTPUT

      # Step 5: Upload the .aab as a downloadable artifact in GitHub Actions
      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickHeroes11-PlayStore-AAB
          path: ${{ steps.locate_bundle.outputs.bundle_path }}
          retention-days: 30
