name: Build Play Store Android App Bundle (.aab)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual one-click build from GitHub Actions tab

jobs:
  build-aab:
    name: Build & Package Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Step 1: Decode Release Keystore if provided in GitHub Secrets
      - name: Check for Release Keystore
        id: keystore_check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding Play Store Release Keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "has_release_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "No custom release keystore secret found. Will build debug App Bundle..."
            echo "has_release_keystore=false" >> $GITHUB_OUTPUT
          fi

      # Step 2: Build the .aab Bundle
      - name: Build Android App Bundle (.aab)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Building App Bundle for Quick Heroes 11..."
          if [ "${{ steps.keystore_check.outputs.has_release_keystore }}" = "true" ]; then
            gradle :app:bundleRelease
          else
            gradle :app:bundleDebug
          fi

      # Step 3: Locate the generated .aab file
      - name: Locate AAB Output
        id: locate_bundle
        run: |
          AAB_FILE=$(find app/build/outputs/bundle -name "*.aab" | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            echo "Error: No .aab file was generated!"
            exit 1
          fi
          echo "Found bundle: $AAB_FILE"
          echo "bundle_path=$AAB_FILE" >> $GITHUB_OUTPUT

      # Step 4: Upload the .aab as a downloadable artifact in GitHub Actions
      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickHeroes11-PlayStore-AAB
          path: ${{ steps.locate_bundle.outputs.bundle_path }}
          retention-days: 30
